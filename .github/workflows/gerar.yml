name: Gerar post
on:
  schedule:
    - cron: '0 10 * * *' # 7h em Brasília
  workflow_dispatch:
permissions:
  contents: write
concurrency: instagram
jobs:
  gerar:
    if: vars.ATIVO == 'sim'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-montserrat
      - run: npm ci
      - run: npm test
      - run: npm run gerar
        env:
          CONTAS_ATIVAS: ${{ vars.CONTAS_ATIVAS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      - name: Salvar estado
        if: always()
        run: |
          git config user.name "umbrella-instagram[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add estado
          git diff --cached --quiet || (git commit -m "estado: post gerado $(date -u +%F)" && git push)
