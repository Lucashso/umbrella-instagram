name: Aprovacao pelo Telegram
on:
  workflow_dispatch:
    inputs:
      acao:
        required: true
      id:
        required: true
      versao:
        required: true
      pedido:
        required: false
      conta:
        required: false
permissions:
  contents: write
concurrency:
  group: instagram
  cancel-in-progress: false
jobs:
  executar:
    if: vars.ATIVO == 'sim'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # A fila acima segura a execução, mas o commit do disparo fica velho: lê sempre o estado mais novo.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-montserrat
      - run: npm ci
      - run: node src/acao.js
        env:
          # Via env, nunca interpolado no shell: o pedido é texto livre.
          ACAO: ${{ inputs.acao }}
          POST_ID: ${{ inputs.id }}
          POST_VERSAO: ${{ inputs.versao }}
          PEDIDO: ${{ inputs.pedido }}
          CONTA: ${{ inputs.conta }}
          CONTAS_ATIVAS: ${{ vars.CONTAS_ATIVAS }}
          PUBLICAR_DE_VERDADE: ${{ vars.PUBLICAR_DE_VERDADE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID_PRISCILLA: ${{ secrets.IG_USER_ID_PRISCILLA }}
          IG_ACCESS_TOKEN_PRISCILLA: ${{ secrets.IG_ACCESS_TOKEN_PRISCILLA }}
          IG_USER_ID_ARCANA: ${{ secrets.IG_USER_ID_ARCANA }}
          IG_ACCESS_TOKEN_ARCANA: ${{ secrets.IG_ACCESS_TOKEN_ARCANA }}
          IG_USER_ID_LEME: ${{ secrets.IG_USER_ID_LEME }}
          IG_ACCESS_TOKEN_LEME: ${{ secrets.IG_ACCESS_TOKEN_LEME }}
      - name: Salvar estado
        if: always()
        run: |
          git config user.name "umbrella-instagram[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add estado
          git diff --cached --quiet || (git commit -m "estado: ${{ inputs.acao }}" && git push)
